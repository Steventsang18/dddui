[package]
name = "dodiddoneui-desktop"
version = "0.1.0"
description = "DoDidDoneUi desktop shell (Tauri 2, sidecar-hosted Rust backend)"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
