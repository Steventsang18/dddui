[package]
name = "roseui-project"
version.workspace = true
edition.workspace = true

[dependencies]
roseui-api-types.workspace = true
roseui-auth.workspace = true
roseui-common.workspace = true
roseui-db.workspace = true
axum.workspace = true
url.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true
# Runtime link (Project Explorer fs runtime): async provider IO + non-recursive watch.
tokio.workspace = true
async-trait.workspace = true
